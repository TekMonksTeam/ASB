flow:
  name: Excel to Mon API
  disabled: false
  expandRouteProperties: true
	
listener:
  type: rest_listener
  isMessageGenerator: true
  host: 127.0.0.1
  port: 8484
  secured: false
  url: "/exceltomon"
  method: "POST"
  allow_origin: "*"
  timeout: 240000

route0:
  type: js
  dependencies: listener
  isAsync: true
  module: "{{{ESB_DIR}}}/custom/save_excel.js"
  dir_to_save: "{{{ESB_DIR}}}/in_excels"

route1:
  type: js
  dependencies:
  - listener
  - route0
  isAsync: true
  module: "{{{ESB_DIR}}}/custom/excel_to_json.js"

route2:
  type: js
  dependencies:
  - listener
  - route0
  - route1
  isAsync: true
  module: "{{{ESB_DIR}}}/custom/save_mons.js"
  db_path: "{{{ESB_DIR}}}/../monboss/db/monboss.db"
  db_creation_sqls_path: "{{{ESB_DIR}}}/../monboss/db/monboss_db_schema.json"
  template_path: "{{{ESB_DIR}}}/../monboss/conf/mon.template.json"

output:
  type: rest_responder
  dependencies:
  - listener
  - route0
  - route1
  - route2
  